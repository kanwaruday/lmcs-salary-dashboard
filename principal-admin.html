<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCS — Principal Dashboard Admin</title>
<style>
:root{--red:#CE0000;--red-h:#a50000;--red-lt:rgba(206,0,0,.07);--dark:#1a1a1a;--gray:#555;--lgray:#f5f5f5;--border:#ddd;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--white);color:var(--dark);font-size:12px;min-height:100vh}

.hdr{background:var(--red);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--red-h);flex-wrap:wrap;gap:10px}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:32px;height:32px;border-radius:4px;object-fit:cover;flex-shrink:0}
.hdr h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.hdr p{font-size:9.5px;opacity:.75;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}

.main{padding:16px 20px;max-width:1000px;margin:0 auto}

.auth-strip{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--lgray)}
.auth-strip.signed-in{border-color:#bbf7d0;background:#f0fdf4}
.auth-strip.denied{border-color:#fecaca;background:#fff0f0}
.auth-text{color:var(--gray);font-size:11.5px}
.auth-text b{color:var(--dark)}
#g_id_signin{display:flex}

.section{margin-bottom:20px}
.section-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.section-title::before{content:'';width:3px;height:14px;background:var(--red);border-radius:2px;display:inline-block}

.tbl-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:var(--lgray);color:var(--gray);font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--red-lt)}
tbody td{padding:7px 12px;font-size:11.5px;vertical-align:middle}
.td-val{font-family:monospace;font-weight:600;color:var(--dark)}
.td-campus{color:var(--red);font-weight:700;font-size:11px}
.row-actions{display:flex;gap:6px}

.btn{background:var(--white);color:var(--gray);border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-size:10.5px;font-weight:600;padding:5px 11px;transition:all .12s}
.btn:hover{background:var(--lgray);color:var(--dark)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn-primary:hover{background:var(--red-h)}
.btn-danger:hover{background:#fff0f0;color:var(--red-h);border-color:#fecaca}

.form-grid{display:grid;grid-template-columns:2fr 1.5fr 1fr auto;gap:8px;align-items:end;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px}
.fld label{display:block;font-size:9.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:5px}
.fld input, .fld select{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:5px;color:var(--dark);font-family:monospace;font-size:11.5px;font-weight:600;padding:6px 8px;outline:none}
.fld input:focus, .fld select:focus{border-color:var(--red)}

.status-msg{font-size:11px;margin-top:10px;padding:8px 12px;border-radius:6px}
.status-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
.status-err{background:#fff0f0;border:1px solid #fecaca;color:var(--red-h)}

.empty-note{color:#9ca3af;font-size:11px;padding:14px;text-align:center}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <img src="logo.png" class="hdr-logo" alt="LMS logo">
    <div>
      <h1>Principal Dashboard — Access List</h1>
      <p>Add, edit, or remove who can sign in to principal.html</p>
    </div>
  </div>
  <div class="hdr-right">
    <span class="hdr-badge">Admin Only</span>
  </div>
</div>

<div class="main">

  <div class="auth-strip" id="auth-strip">
    <div class="auth-text" id="auth-text">Reads are open to anyone with this URL. Sign in with an admin Google account to add, edit, or remove entries.</div>
    <div id="g_id_signin"></div>
  </div>

  <div class="section">
    <div class="section-title">Current Access List</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Campus</th><th></th></tr></thead>
        <tbody id="rows-body"><tr><td colspan="4" class="empty-note">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Add Entry</div>
    <div class="form-grid">
      <div class="fld"><label>Email</label><input type="email" id="add-email" placeholder="name@lms.org.in"></div>
      <div class="fld"><label>Name</label><input type="text" id="add-name" placeholder="Full name"></div>
      <div class="fld">
        <label>Campus</label>
        <select id="add-campus">
          <option value="LMS1">LMS1 — Dhalpur</option>
          <option value="LMS2">LMS2 — Kelheli</option>
          <option value="LMS3">LMS3 — Dunkhra</option>
          <option value="LMS4">LMS4 — Ner Chowk</option>
          <option value="ALL">ALL — Network-wide</option>
        </select>
      </div>
      <button class="btn btn-primary" id="add-btn" onclick="addEntry()" disabled>+ Add</button>
    </div>
    <div id="form-status"></div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
<script>
// Same OAuth Web Client as principal.html — used here only to obtain a fresh
// ID token proving identity to the Apps Script endpoint before any write.
const GOOGLE_CLIENT_ID = '697999989724-mvi85iobr20g4mm8a8nrjd1rms2o8tf6.apps.googleusercontent.com';

const ALLOWLIST_API_URL = 'https://script.google.com/a/macros/lms.org.in/s/AKfycbx9Lfe0bI6RgjaF2aJcgqmfbgGHsg65Ed-N4RA2_VpBmSxCMj389D6PYtgJq9K1qDqcqA/exec';

const CAMPUS_LABELS = {
  LMS1: 'LMS1 — Dhalpur', LMS2: 'LMS2 — Kelheli', LMS3: 'LMS3 — Dunkhra',
  LMS4: 'LMS4 — Ner Chowk', ALL: 'ALL — Network-wide',
};

let idToken = null;

function decodeJwtPayload(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const json = decodeURIComponent(atob(base64).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}

function onGoogleSignIn(response) {
  idToken = response.credential;
  const payload = decodeJwtPayload(idToken);
  const strip = document.getElementById('auth-strip');
  strip.classList.add('signed-in');
  document.getElementById('auth-text').innerHTML = 'Signed in as <b>' + payload.email + '</b>. Write attempts are verified server-side — you\'ll see an error here if this account isn\'t an admin.';
  document.getElementById('add-btn').disabled = false;
}

function initGoogleSignIn() {
  // itp_support fixes a known Safari/iOS issue where Intelligent Tracking Prevention
  // blocks the sign-in callback, leaving a blank page after choosing an account.
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleSignIn, itp_support: true });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'medium' });
}

async function loadEntries() {
  const tbody = document.getElementById('rows-body');
  try {
    const res = await fetch(ALLOWLIST_API_URL + '?action=list', { cache: 'no-store' });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load');
    renderRows(data.entries);
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-note">Could not load the list: ' + esc(err.message) + '</td></tr>';
  }
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderRows(entries) {
  const tbody = document.getElementById('rows-body');
  if (!entries.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty-note">No entries yet.</td></tr>'; return; }
  tbody.innerHTML = entries.map(e => `
    <tr>
      <td class="td-val">${esc(e.email)}</td>
      <td>${esc(e.name)}</td>
      <td class="td-campus">${esc(CAMPUS_LABELS[e.campusId] || e.campusId)}</td>
      <td class="row-actions">
        <button class="btn" onclick="editEntry('${esc(e.email)}','${esc(e.name)}','${esc(e.campusId)}')">Edit</button>
        <button class="btn btn-danger" onclick="deleteEntry('${esc(e.email)}')">Delete</button>
      </td>
    </tr>`).join('');
}

function showStatus(el, ok, msg) {
  el.innerHTML = `<div class="status-msg ${ok ? 'status-ok' : 'status-err'}">${esc(msg)}</div>`;
}

async function callApi(action, params) {
  if (!idToken) { alert('Sign in first.'); return null; }
  const qs = new URLSearchParams({ action, idToken, ...params });
  const res = await fetch(ALLOWLIST_API_URL + '?' + qs.toString(), { cache: 'no-store' });
  return res.json();
}

async function addEntry() {
  const email = document.getElementById('add-email').value.trim();
  const name = document.getElementById('add-name').value.trim();
  const campusId = document.getElementById('add-campus').value;
  const statusEl = document.getElementById('form-status');
  if (!email) { showStatus(statusEl, false, 'Email is required.'); return; }

  const data = await callApi('add', { email, name, campusId });
  if (!data) return;
  if (!data.success) { showStatus(statusEl, false, data.error); return; }
  showStatus(statusEl, true, 'Added ' + email + '.');
  document.getElementById('add-email').value = '';
  document.getElementById('add-name').value = '';
  renderRows(data.entries);
}

async function editEntry(email, currentName, currentCampus) {
  const name = prompt('Name for ' + email + ':', currentName);
  if (name === null) return;
  const campusId = (prompt('Campus for ' + email + ' (LMS1/LMS2/LMS3/LMS4/ALL):', currentCampus) || '').trim().toUpperCase();
  if (!campusId) return;
  const data = await callApi('edit', { email, name, campusId });
  if (!data) return;
  if (!data.success) { alert(data.error); return; }
  renderRows(data.entries);
}

async function deleteEntry(email) {
  if (!confirm('Remove ' + email + ' from the Principal Dashboard access list?')) return;
  const data = await callApi('delete', { email });
  if (!data) return;
  if (!data.success) { alert(data.error); return; }
  renderRows(data.entries);
}

loadEntries();
</script>
</body>
</html>
